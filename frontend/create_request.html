<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Bank - Submit Request</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <style>
        :root { --primary-color: #4f46e5; --primary-hover: #4338ca; --bg-light: #f8fafc; --text-main: #0f172a; --text-muted: #64748b; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-light); color: var(--text-main); -webkit-font-smoothing: antialiased; }

        /* Sidebar Indigo Style - Đồng bộ 100% Dashboard */
        .sidebar { background-color: #ffffff; border-right: 1px solid #e2e8f0; height: 100vh; padding: 1.5rem; transition: 0.3s; }
        .nav-link { border-radius: 14px; transition: all 0.2s; padding: 12px 16px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; display: flex; align-items: center; text-decoration: none; }
        .nav-link:hover { background-color: #f1f5f9; color: var(--primary-color); transform: translateX(4px); }
        .nav-link.active { background-color: var(--primary-color) !important; color: white !important; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }

        /* Modern Form Styling - Đồng bộ Card-main từ Dashboard */
        .card-main { border-radius: 32px; border: none; background: white; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.03), 0 10px 10px -5px rgba(0,0,0,0.02); transition: 0.3s; }
        .form-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 800; margin-bottom: 10px; padding-left: 4px; }
        .form-control { border-radius: 16px; padding: 14px 20px; border: 2px solid #f1f5f9; font-size: 1rem; transition: all 0.2s; background-color: #fcfcff; }
        .form-control:focus { border-color: var(--primary-color); background-color: white; box-shadow: 0 0 0 5px rgba(79, 70, 229, 0.08); outline: none; }
        
        .input-group-text { border-radius: 0 16px 16px 0 !important; background-color: #f1f5f9; border: 2px solid #f1f5f9; border-left: none; color: var(--text-muted); font-weight: 700; padding: 0 20px; }
        .input-group .form-control { border-radius: 16px 0 0 16px !important; }

        .btn-submit { background-color: var(--primary-color); border: none; border-radius: 18px; padding: 18px; font-weight: 800; color: white; transition: all 0.3s; letter-spacing: 1px; }
        .btn-submit:hover { background-color: var(--primary-hover); transform: translateY(-3px); box-shadow: 0 15px 30px rgba(79, 70, 229, 0.3); }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <nav class="col-md-2 sidebar sticky-top d-none d-md-flex flex-column">
                <div class="px-3 mb-5 d-flex align-items-center">
                    <div class="bg-primary p-2 rounded-3 me-3"><i class="bi bi-clock-history text-white fs-5"></i></div>
                    <h4 class="fw-bold text-primary mb-0" style="letter-spacing: -1px;">TIME BANK</h4>
                </div>
                <ul class="nav flex-column flex-grow-1">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2 me-3"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="create_request.html"><i class="bi bi-plus-circle me-3"></i>Submit Request</a></li>
                    <li class="nav-item"><a class="nav-link" href="available_tasks.html"><i class="bi bi-search me-3"></i>Available Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="my_tasks.html"><i class="bi bi-briefcase me-3"></i>My Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="exchange.html"><i class="bi bi-currency-exchange me-3"></i>Nạp & Rút giờ</a></li>
                </ul>
                
            </nav>

            <main class="col-md-10 p-4 p-md-5">
                <div class="col-lg-8 mx-auto">
                    <div class="mb-5">
                        <h2 class="fw-bold mb-1" style="letter-spacing: -1.5px;">Tạo yêu cầu trao đổi</h2>
                        <p class="text-muted fw-medium">Đăng bài để tìm kiếm sự giúp đỡ từ cộng đồng tài năng.</p>
                    </div>

                    <div class="card card-main p-4 p-md-5">
                        <form id="createTaskForm">
                            <div class="mb-4">
                                <label for="taskTitle" class="form-label">Tiêu đề công việc</label>
                                <input type="text" class="form-control" id="taskTitle" placeholder="Cần người hướng dẫn cài đặt SQL Server..." required/>
                            </div>
                            <div class="mb-4">
                                <label for="taskSkills" class="form-label">Kỹ năng cần thiết</label>
                                <input type="text" class="form-control" id="taskSkills" placeholder="Ví dụ: SQL, Database, C++..." />
                            </div>
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="taskCredit" class="form-label">Thù lao (Số giờ)</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control shadow-none" id="taskCredit" placeholder="1.0" min="0.5" step="0.5" required/>
                                        <span class="input-group-text">GIỜ</span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="taskDeadline" class="form-label">Hạn hoàn thành (Deadline)</label>
                                    <input type="datetime-local" class="form-control shadow-none" id="taskDeadline" required/>
                                </div>
                            </div>
                            <div class="mb-5">
                                <label for="taskDescription" class="form-label">Mô tả công việc (JD)</label>
                                <textarea class="form-control shadow-none" id="taskDescription" rows="5" placeholder="Hãy mô tả chi tiết các đầu việc bạn cần hỗ trợ và phương thức liên lạc" required></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-submit shadow-lg">ĐĂNG YÊU CẦU NGAY</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/create_request.js"></script>
</body>
</html>
