<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Time Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light"> 

    <div class="container d-flex align-items-center justify-content-center vh-100">
        <div class="row w-100 justify-content-center">
            
            <div class="col-md-6 col-lg-5"> 
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <div class="text-center mb-4">
                            <h3 class="text-primary fw-bold mb-1">
                                <i class="bi bi-clock-history me-2"></i>TIME BANK
                            </h3>
                            <p class="text-muted">Đăng nhập để tiếp tục</p>
                        </div>
                        
                        <form id="loginForm">
                            
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Tên đăng nhập</label>
                                <input type="text" id="username" class="form-control form-control-lg bg-light" placeholder="Nhập tên user..." required>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label for="password" class="form-label fw-semibold mb-0">Mật khẩu</label>
                                    <a href="forgot_password.html" class="text-decoration-none small">Quên mật khẩu?</a>
                                </div>
                                <input type="password" id="password" class="form-control form-control-lg bg-light mt-2" placeholder="••••••••" required>
                            </div>

                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label text-muted small" for="rememberMe">Ghi nhớ đăng nhập</label>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">ĐĂNG NHẬP</button>
                            
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="text-muted">Chưa có tài khoản? </span>
                            <a href="register.html" class="text-decoration-none fw-semibold">Đăng ký ngay</a>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/login.js"></script>

</body>
</html>
