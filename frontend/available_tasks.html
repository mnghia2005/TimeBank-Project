<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Bank - Available Tasks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <style>
        :root { --primary-color: #4f46e5; --bg-light: #f8fafc; --text-main: #0f172a; --text-muted: #64748b; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-light); color: var(--text-main); -webkit-font-smoothing: antialiased; }
        
        /* Sidebar Indigo Style - Đồng bộ từ Dashboard */
        .sidebar { background-color: #ffffff; border-right: 1px solid #e2e8f0; height: 100vh; padding: 1.5rem; transition: 0.3s; }
        .nav-link { border-radius: 14px; transition: all 0.2s; padding: 12px 16px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; display: flex; align-items: center; text-decoration: none; }
        .nav-link:hover { background-color: #f1f5f9; color: var(--primary-color); transform: translateX(4px); }
        .nav-link.active { background-color: var(--primary-color) !important; color: white !important; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }

        /* UI Elements - Đồng bộ Card & Table */
        .search-wrapper { background: white; border-radius: 20px; border: 1px solid #e2e8f0; padding: 6px 12px; transition: all 0.2s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .search-wrapper:focus-within { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        
        .card-main { border-radius: 32px; border: none; background: white; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04); overflow: hidden; transition: 0.3s; }
        .table thead th { background-color: #f8fafc; border: none; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.1em; color: var(--text-muted); padding: 20px 24px; }
        .task-row { cursor: pointer; transition: 0.2s; border-bottom: 1px solid #f8fafc; }
        .task-row:hover { background-color: #fcfcff !important; }
        
        .badge-time { background-color: rgba(79, 70, 229, 0.1); color: var(--primary-color); font-weight: 800; padding: 8px 16px; border-radius: 12px; font-size: 0.9rem; }
        .btn-accept { background-color: var(--primary-color); border: none; border-radius: 14px; padding: 10px 24px; font-weight: 700; color: white; transition: 0.3s; }
        .btn-accept:hover { background-color: #4338ca; transform: translateY(-2px); box-shadow: 0 10px 15px rgba(79, 70, 229, 0.2); }

        /* Details Offcanvas - Giữ nguyên Structure */
        .offcanvas { width: 520px !important; border: none; box-shadow: -20px 0 50px rgba(0,0,0,0.05); border-radius: 40px 0 0 40px; }
        .detail-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); font-weight: 800; letter-spacing: 1px; margin-bottom: 8px; }
        .jd-box { background-color: #f8fafc; border-radius: 24px; padding: 28px; border: 1px solid #f1f5f9; line-height: 1.8; color: #334155; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <nav class="col-md-2 sidebar sticky-top d-none d-md-flex flex-column">
                <div class="px-3 mb-5 d-flex align-items-center">
                    <div class="bg-primary p-2 rounded-3 me-3"><i class="bi bi-clock-history text-white fs-5"></i></div>
                    <h4 class="fw-bold text-primary mb-0" style="letter-spacing: -1px;">TIME BANK</h4>
                </div>
                <ul class="nav flex-column flex-grow-1">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2 me-3"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="create_request.html"><i class="bi bi-plus-circle me-3"></i>Submit Request</a></li>
                    <li class="nav-item"><a class="nav-link active" href="available_tasks.html"><i class="bi bi-search me-3"></i>Available Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="my_tasks.html"><i class="bi bi-briefcase me-3"></i>My Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="exchange.html"><i class="bi bi-currency-exchange me-3"></i>Nạp & Rút giờ</a></li>
                </ul>
                
            </nav>

            <main class="col-md-10 p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <div>
                        <h2 class="fw-bold mb-1" style="letter-spacing: -1.5px;">Danh sách việc làm</h2>
                        <p class="text-muted fw-medium">Khám phá các yêu cầu hỗ trợ từ cộng đồng.</p>
                    </div>
                    <div id="statusMessage" class="alert alert-success d-none py-3 px-4 border-0 rounded-4 shadow-sm mb-0">
                        <i class="bi bi-check-circle-fill me-2"></i> Nhận việc thành công! Kiểm tra tại <strong>My Tasks</strong>.
                    </div>
                </div>

                <div class="row mb-5">
                    <div class="col-md-6 col-lg-5">
                        <div class="input-group search-wrapper overflow-hidden">
                            <span class="input-group-text bg-white border-0 py-3 ps-3"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" id="taskSearch" class="form-control border-0 py-3 shadow-none fw-medium" placeholder="Tìm tên việc, kỹ năng, người đăng..." />
                        </div>
                    </div>
                </div>

                <div class="card card-main">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-5">Công việc / Người đăng</th>
                                        <th>Giá trị (h)</th>
                                        <th>Hạn chót</th>
                                        <th class="text-center pe-5">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="taskTableBody">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="taskDetailOffcanvas">
        <div class="offcanvas-header p-5 pb-4">
            <h4 class="offcanvas-title fw-bold text-dark" style="letter-spacing: -1px;">Chi tiết công việc</h4>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-5 pt-0" id="offcanvasContent"></div>
        <div class="offcanvas-footer p-5 pt-0 border-0 bg-white" id="offcanvasFooter"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/available_tasks.js"></script>
</body>
</html>
