<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành viên - Time Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="row w-100 justify-content-center">
            
            <div class="col-md-8 col-lg-6"> 
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <div class="text-center mb-4">
                            <h3 class="text-primary fw-bold mb-1">
                                <i class="bi bi-person-plus-fill me-2"></i>Đăng ký tài khoản
                            </h3>
                            <p class="text-muted">Tham gia cộng đồng Time Bank ngay!</p>
                        </div>
                        
                        <form id="registerForm" action="login.html" method="POST"> 
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="fullname" class="form-label fw-semibold">Họ và tên</label>
                                    <input type="text" id="fullname" name="fullname" class="form-control bg-light" placeholder="Ví dụ: Nguyễn Văn A" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="username" class="form-label fw-semibold">Tên đăng nhập</label>
                                    <input type="text" id="username" name="username" class="form-control bg-light" placeholder="nguyenvana123" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <input type="email" id="email" name="email" class="form-control bg-light" placeholder="email@example.com" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                                    <input type="password" id="password" name="password" class="form-control bg-light" placeholder="Tạo mật khẩu" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="confirm_password" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                                    <input type="password" id="confirm_password" name="confirm_password" class="form-control bg-light" placeholder="Nhập lại mật khẩu" required>
                                </div>
                            </div>

                            <div id="passwordError" class="alert alert-danger d-none py-2 small mb-4" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-1"></i> Mật khẩu xác nhận không khớp! Vui lòng kiểm tra lại.
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">ĐĂNG KÝ NGAY</button>
                            
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="text-muted">Đã có tài khoản? </span>
                            <a href="login.html" class="text-decoration-none fw-semibold">Đăng nhập tại đây</a>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/register.js"></script>
</body>
</html>
