<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Time Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light"> 

    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="row w-100 justify-content-center">
            
            <div class="col-md-6 col-lg-5"> 
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <div class="text-center mb-4">
                            <h3 class="text-primary fw-bold mb-1">
                                <i class="bi bi-shield-lock me-2"></i>Reset Password
                            </h3>
                            <p id="nmn1"lass="text-muted small">Enter your email address and we'll send you a link to reset your password.</p>
                        </div>
                        
                        <form id="forgotPasswordForm" action="#" method="POST">
                            <div class="mb-4">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <input type="email" id="email" name="email" class="form-control form-control-lg bg-light" placeholder="name@example.com" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                                <i class="bi bi-envelope-paper me-2"></i>Send Reset Link
                            </button>
                        </form>

                        <div id="successMessage" class="text-center d-none pt-0 pb-2">
                            <div class="mb-1 ">
                                <i class="bi bi-envelope-check-fill text-success" style="font-size: 3rem;"></i>
                            </div>
                            <h5 class="fw-bold text-dark">Check your inbox</h5>
                            <p class="text-muted small mb-0">We have sent a password reset link to <strong id="userEmailDisplay" class="text-dark"></strong>.</p>
                            <p class="text-muted small mt-1">Please check your spam folder if you don't see it.</p>
                        </div>

                        <div class="text-center mt-4 pt-3 border-top">
                            <a href="login.html" class="text-decoration-none fw-semibold text-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Back to Login
                            </a>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/forgot_password.js">
       
    </script>
</body>
</html>
