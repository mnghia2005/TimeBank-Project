<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Bank - Cài đặt tài khoản</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --primary-color: #4f46e5; --bg-light: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-light); -webkit-font-smoothing: antialiased; }
        .sidebar { background: white; border-right: 1px solid #e2e8f0; height: 100vh; padding: 1.5rem; }
        .nav-link { border-radius: 12px; padding: 12px 16px; font-weight: 500; color: #64748b; margin-bottom: 4px; }
        .nav-link.active { background: var(--primary-color); color: white !important; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
        .card-settings { border-radius: 24px; border: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02), 0 10px 15px -3px rgba(0,0,0,0.03); }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <nav class="col-md-2 sidebar sticky-top d-none d-md-flex flex-column">
                <div class="px-3 mb-5"><h4 class="fw-bold text-primary"><i class="bi bi-clock-history me-2"></i>TIME BANK</h4></div>
                <ul class="nav flex-column flex-grow-1">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-grid-1x2 me-3"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="create_request.html"><i class="bi bi-pencil-square me-3"></i> Submit Request</a></li>
                    <li class="nav-item"><a class="nav-link" href="available_tasks.html"><i class="bi bi-card-list me-2"></i> Available Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="my_tasks.html"><i class="bi bi-briefcase me-2"></i> My Task</a></li>
                    <li class="nav-item"><a class="nav-link" href="exchange.html"><i class="bi bi-currency-exchange me-2"></i> Nạp & Rút giờ</a></li>
                </ul>
                <div class="mt-auto border-top pt-3">
                    <a class="nav-link active" href="settings.html"><i class="bi bi-gear-fill me-3"></i> Settings</a>
                    <a class="nav-link text-danger" href="#" id="btnLogout"><i class="bi bi-box-arrow-right me-3"></i> Logout</a>
                </div>
            </nav>

            <main class="col-md-10 p-4 p-md-5">
                <h2 class="mb-5 fw-bold" style="letter-spacing: -1px;">Cài đặt tài khoản</h2>
                <div class="row">
                    <div class="col-lg-8">
                        <div class="card card-settings mb-4">
                            <div class="card-body p-4 p-md-5">
                                <h5 class="fw-bold mb-4 border-bottom pb-2"><i class="bi bi-person-lines-fill me-2 text-primary"></i>Thông tin hồ sơ</h5>
                                <form id="profileForm">
                                    <div class="row mb-4 align-items-center">
                                        <div class="col-sm-3 text-center mb-3 mb-sm-0">
                                            <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center text-primary mb-2" style="width: 90px; height: 90px;">
                                                <i class="bi bi-person-fill fs-1"></i>
                                            </div>
                                         
                                        </div>
                                        <div class="col-sm-9">
                                            <label class="form-label fw-bold small text-uppercase text-muted">Tên đăng nhập</label>
                                            <input type="text" class="form-control bg-light text-muted" id="username" readonly>
                                            <div class="form-text small">Tên đăng nhập cố định.</div>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small text-uppercase text-muted">Họ và tên</label>
                                        <input type="text" class="form-control rounded-3 py-2" id="fullname" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold small text-uppercase text-muted">Địa chỉ Email</label>
                                        <input type="email" class="form-control rounded-3 py-2" id="email" required>
                                    </div>
                                    
                                </form>
                            </div>
                        </div>

                        <div class="card card-settings">
                            <div class="card-body p-4 p-md-5">
                                <h5 class="fw-bold mb-4 border-bottom pb-2"><i class="bi bi-shield-lock-fill me-2 text-warning"></i>Đổi mật khẩu</h5>
                                <form id="changePasswordForm">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small text-uppercase text-muted">Mật khẩu hiện tại</label>
                                        <input type="password" class="form-control rounded-3 py-2" id="currentPassword" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small text-uppercase text-muted">Mật khẩu mới</label>
                                        <input type="password" class="form-control rounded-3 py-2" id="newPassword" placeholder="Tối thiểu 8 ký tự" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold small text-uppercase text-muted">Xác nhận mật khẩu mới</label>
                                        <input type="password" class="form-control rounded-3 py-2" id="confirmNewPassword" required>
                                    </div>
                                    <div class="text-end"><button type="submit" class="btn btn-warning px-4 py-2 fw-bold text-dark rounded-3">Cập nhật mật khẩu</button></div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/settings.js"></script>
</body>
</html>s
